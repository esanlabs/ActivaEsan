<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activaciones | Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de Colores de Marca -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              rojo: '#E3173E',
              gris: '#696A6d',
              negro: '#000000',
              blanco: '#ffffff'
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>

  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core/locales/es.global.min.js"></script>

  <!-- Tippy.js & Popper.js para los Cuadros al Pasar el Mouse -->
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css" />

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 font-sans text-marca-negro">

  <!-- Encabezado / Navbar -->
  <header class="bg-marca-blanco shadow-sm border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-marca-rojo flex items-center justify-center text-marca-blanco font-bold">A</div>
        <h1 class="text-xl font-bold tracking-tight">Gestión de Activaciones</h1>
      </div>
      
      <!-- Botones principales -->
      <div class="flex items-center gap-3">
        <a href="https://docs.google.com/spreadsheets/d/1sOXUQEd9q5zTfRL0VZJOL70aBeCgB14Sl0HkVhbTdMw/edit?gid=694076798#gid=694076798" 
           target="_blank" 
           class="bg-green-600 hover:bg-green-700 text-marca-blanco px-4 py-2.5 rounded-full font-medium transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2 text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          Ver Excel
        </a>
        <button onclick="abrirModalNuevo()" class="bg-marca-rojo hover:bg-red-700 text-marca-blanco px-5 py-2.5 rounded-full font-medium transition-all duration-300 transform hover:scale-105 shadow-md hover:shadow-lg flex items-center gap-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          Nueva Activación
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Loader de Carga -->
    <div id="loader" class="flex flex-col items-center justify-center py-20 text-marca-gris">
      <svg class="animate-spin h-10 w-10 text-marca-rojo mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <p class="font-medium">Sincronizando con Google Sheets...</p>
    </div>

    <!-- Contenedor del Calendario -->
    <div id="calendarContainer" class="hidden bg-marca-blanco p-6 rounded-2xl shadow-lg border border-gray-100 animate-slide-up">
      <div id="calendar"></div>
    </div>
  </main>

  <!-- Ventana Modal de Formulario -->
  <div id="modalOverlay" class="fixed inset-0 bg-marca-negro/40 backdrop-blur-sm hidden z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
    <div id="modalBox" class="bg-marca-blanco rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-300 relative">
      
      <!-- Cabecera del Modal -->
      <div class="sticky top-0 bg-marca-blanco px-8 py-5 border-b border-gray-100 flex justify-between items-center z-10">
        <h2 id="modalTitulo" class="text-2xl font-bold text-marca-negro">Registrar Activación</h2>
        <button onclick="cerrarModal()" class="text-marca-gris hover:text-marca-rojo transition-colors bg-gray-100 p-2 rounded-full">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-8">
        <!-- Mensaje de Alerta por Conflicto -->
        <div id="alertaConflicto" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-marca-rojo animate-fade-in flex gap-3">
          <svg class="w-6 h-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <div>
            <p class="font-bold">Error de disponibilidad</p>
            <p id="mensajeConflicto" class="text-sm mt-1 text-marca-gris"></p>
          </div>
        </div>

        <!-- Formulario -->
        <form id="formActivacion" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          
          <!-- Bloque de Fecha y Tablet (Obligatorios) -->
          <div class="col-span-1 md:col-span-2 grid grid-cols-2 gap-5 p-5 bg-gray-50 rounded-xl mb-2">
            <div>
              <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Fecha de Evento <span class="text-marca-rojo">*</span></label>
              <input type="date" id="fechaEvento" required class="w-full input-elegant rounded-lg p-2.5 text-sm bg-white">
            </div>
            <div>
              <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Tablet <span class="text-marca-rojo">*</span></label>
              <select id="tablet" required class="w-full input-elegant rounded-lg p-2.5 text-sm bg-white">
                <option value="Tablet 1">Tablet 1</option>
                <option value="Tablet 2">Tablet 2</option>
                <option value="Tablet 3">Tablet 3</option>
                <option value="Tablet 4">Tablet 4</option>
                <option value="Tablet 5">Tablet 5</option>
                <option value="Tablet 6">Tablet 6</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Ticket <span class="text-marca-rojo">*</span></label>
            <input type="text" id="ticket" placeholder="Ej: 258988" required class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Tipo de Evento <span class="text-marca-rojo">*</span></label>
            <input type="text" id="tipoEvento" placeholder="Ej: Feria Vocacional" required class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Área Solicitante <span class="text-marca-rojo">*</span></label>
            <select id="area" required class="w-full input-elegant rounded-lg p-2.5 text-sm">
              <option value="DPA">DPA</option>
              <option value="MKT Postgrado">MKT Postgrado</option>
              <option value="MKT Pregrado">MKT Pregrado</option>
              <option value="Imagen">Imagen</option>
              <option value="Maestrias">Maestrias</option>
              <option value="ESAN Labs">ESAN Labs</option>
              <option value="Permanencia Estudiantil">Permanencia Estudiantil</option>
              <option value="GTH">GTH</option>
              <option value="Esan Ediciones">Esan Ediciones</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Tipo de Servicio</label>
            <select id="servicio" class="w-full input-elegant rounded-lg p-2.5 text-sm">
              <option value="Foto QR">Foto QR</option>
              <option value="Foto Impresa">Foto Impresa</option>
              <option value="Foto Impresa + QR">Foto Impresa + QR</option>
              <option value="Foto Correo">Foto Correo</option>
              <option value="360°">360°</option>
              <option value="Foto impresa + 360°">Foto impresa + 360°</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Solicita</label>
            <input type="text" id="solicita" placeholder="Nombre de quien solicita" class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Estado</label>
            <select id="estado" class="w-full input-elegant rounded-lg p-2.5 text-sm">
              <option value="Confirmado">Confirmado</option>
              <option value="En espera">En espera</option>
              <option value="Culminado">Culminado</option>
              <option value="Cancelado">Cancelado</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Centro Costos</label>
            <input type="text" id="costos" class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">N° Personas</label>
            <input type="number" id="personas" class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <!-- N° Fotos (SOLO VISIBLE AL EDITAR) -->
          <div id="contenedorFotos" class="hidden">
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">N° Fotos Realizadas</label>
            <input type="number" id="fotos" class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <!-- Link Drive / Archivos (SOLO VISIBLE AL EDITAR) -->
          <div id="contenedorLink" class="col-span-1 md:col-span-2 hidden">
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Link Drive / Archivos (6N)</label>
            <input type="url" id="link" placeholder="https://drive.google.com/..." class="w-full input-elegant rounded-lg p-2.5 text-sm">
          </div>

          <!-- Observaciones -->
          <div class="col-span-1 md:col-span-2">
            <label class="block text-xs font-bold text-marca-gris uppercase tracking-wider mb-2">Observaciones</label>
            <textarea id="observaciones" rows="2" class="w-full input-elegant rounded-lg p-2.5 text-sm"></textarea>
          </div>

          <!-- Botones de Acción -->
          <div class="col-span-1 md:col-span-2 flex justify-end gap-3 mt-4 pt-4 border-t border-gray-100">
            <button type="button" onclick="cerrarModal()" class="px-6 py-2.5 rounded-full text-marca-gris hover:bg-gray-100 font-medium transition-colors">Cancelar</button>
            <button type="submit" id="btnGuardar" class="px-6 py-2.5 rounded-full bg-marca-negro hover:bg-marca-gris text-marca-blanco font-medium transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2">
              Guardar Registro
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JavaScript Principal -->
  <script src="script.js" defer></script>
</body>
</html>
