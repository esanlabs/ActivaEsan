<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activaciones | Dashboard Admin</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de Colores de Marca -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              rojo: '#E3173E',
              gris: '#696A6d',
              negro: '#000000',
              blanco: '#ffffff'
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out'
          }
        }
      }
    }
  </script>

  <!-- FullCalendar & Tippy -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core/locales/es.global.min.js"></script>
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css" />

  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 font-sans text-marca-negro">

  <!-- Header -->
  <header class="bg-marca-blanco shadow-sm border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-marca-rojo flex items-center justify-center text-marca-blanco font-bold">A</div>
        <h1 class="text-xl font-bold tracking-tight">Gestión de Activaciones <span class="text-xs bg-red-100 text-marca-rojo px-2 py-0.5 rounded-full uppercase ml-2">Admin</span></h1>
      </div>
      
      <div class="flex items-center gap-3">
        <a href="https://docs.google.com/spreadsheets/d/1sOXUQEd9q5zTfRL0VZJOL70aBeCgB14Sl0HkVhbTdMw/edit?gid=694076798#gid=694076798" 
           target="_blank" 
           class="bg-green-600 hover:bg-green-700 text-marca-blanco px-4 py-2.5 rounded-full font-medium transition-all shadow-md text-sm flex items-center gap-2">
          Ver Excel
        </a>
        <button onclick="abrirModalNuevo()" class="bg-marca-rojo hover:bg-red-700 text-marca-blanco px-5 py-2.5 rounded-full font-medium transition-all transform hover:scale-105 shadow-md text-sm flex items-center gap-2">
          Nueva Activación
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Loader -->
    <div id="loader" class="flex flex-col items-center justify-center py-20 text-marca-gris">
      <p class="font-medium">Sincronizando con Google Sheets...</p>
    </div>

    <!-- Contenedor del Calendario + Filtros -->
    <div id="calendarContainer" class="hidden space-y-4 animate-slide-up">
      
      <!-- BARRA DE FILTROS Y LEYENDA (EXCLUSIVO ADMIN) -->
      <div class="bg-marca-blanco p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-center justify-between">
        
        <!-- Filtros Dropdowns -->
        <div class="flex flex-wrap items-center gap-3">
          <span class="text-xs font-bold text-marca-gris uppercase tracking-wider">Filtros:</span>
          
          <select id="filtroArea" onchange="aplicarFiltros()" class="border-gray-200 rounded-lg p-2 text-xs border focus:outline-none focus:border-marca-rojo bg-gray-50">
            <option value="TODAS">Todas las Áreas</option>
            <option value="DPA">DPA</option>
            <option value="MKT Postgrado">MKT Postgrado</option>
            <option value="MKT Pregrado">MKT Pregrado</option>
            <option value="Imagen">Imagen</option>
            <option value="Maestrias">Maestrias</option>
            <option value="ESAN Labs">ESAN Labs</option>
            <option value="Permanencia Estudiantil">Permanencia Estudiantil</option>
            <option value="GTH">GTH</option>
            <option value="Esan Ediciones">Esan Ediciones</option>
          </select>

          <select id="filtroServicio" onchange="aplicarFiltros()" class="border-gray-200 rounded-lg p-2 text-xs border focus:outline-none focus:border-marca-rojo bg-gray-50">
            <option value="TODOS">Todos los Servicios</option>
            <option value="Foto Booth">Foto Booth</option>
            <option value="360°">360°</option>
            <option value="Foto Gif Impresión">Foto Gif Impresión</option>
            <option value="Foto Gif Virtual">Foto Gif Virtual</option>
          </select>
        </div>

        <!-- Leyenda de Colores -->
        <div class="flex items-center gap-4 text-xs font-medium text-marca-gris">
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#E3173E]"></span> Foto Gif</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#2563EB]"></span> Foto Booth</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#16A34A]"></span> 360°</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-[#000000]"></span> Pasado / Cancelado</div>
        </div>

      </div>

      <!-- Calendario -->
      <div class="bg-marca-blanco p-6 rounded-2xl shadow-lg border border-gray-100">
        <div id="calendar"></div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-marca-negro/40 backdrop-blur-sm hidden z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
    <div id="modalBox" class="bg-marca-blanco rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-300 relative">
      
      <div class="sticky top-0 bg-marca-blanco px-8 py-5 border-b border-gray-100 flex justify-between items-center z-10">
        <h2 id="modalTitulo" class="text-2xl font-bold text-marca-negro">Registrar Activaciones</h2>
        <button onclick="cerrarModal()" class="text-marca-gris hover:text-marca-rojo bg-gray-100 p-2 rounded-full">✕</button>
      </div>

      <div class="p-8">
        <!-- Alertas -->
        <div id="alertaConflicto" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-marca-rojo text-sm font-medium"></div>

        <form id="formActivacion" class="space-y-6">
          
          <!-- SECCIÓN 1: DATOS GENERALES -->
          <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
            <h3 class="text-sm font-bold text-marca-negro mb-4 uppercase tracking-wider">Datos Generales</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              
              <div id="contenedorCantidad">
                <label class="block text-xs font-bold text-marca-gris mb-1">N° de Activaciones</label>
                <input type="number" id="cantActivaciones" min="1" max="10" value="1" onchange="renderizarBloques()" class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none focus:border-marca-rojo">
              </div>

              <div>
                <label class="block text-xs font-bold text-marca-gris mb-1">Área Solicitante *</label>
                <select id="area" required class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none focus:border-marca-rojo">
                  <option value="DPA">DPA</option>
                  <option value="MKT Postgrado">MKT Postgrado</option>
                  <option value="MKT Pregrado">MKT Pregrado</option>
                  <option value="Imagen">Imagen</option>
                  <option value="Maestrias">Maestrias</option>
                  <option value="ESAN Labs">ESAN Labs</option>
                  <option value="Permanencia Estudiantil">Permanencia Estudiantil</option>
                  <option value="GTH">GTH</option>
                  <option value="Esan Ediciones">Esan Ediciones</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-marca-gris mb-1">Solicita (Nombre) *</label>
                <input type="text" id="solicita" required class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none focus:border-marca-rojo">
              </div>

              <div>
                <label class="block text-xs font-bold text-marca-gris mb-1">Centro Costos</label>
                <input type="text" id="costos" class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none focus:border-marca-rojo">
              </div>

              <div class="col-span-1 md:col-span-2">
                <label class="block text-xs font-bold text-marca-gris mb-1">Observaciones Generales</label>
                <textarea id="observaciones" rows="2" class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none focus:border-marca-rojo"></textarea>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 2: BLOQUES DINÁMICOS -->
          <div id="contenedorBloques" class="space-y-4"></div>

          <!-- SECCIÓN 3: EDICIÓN ADMINISTRADOR -->
          <div id="contenedorEdicion" class="hidden bg-red-50 p-5 rounded-xl border border-red-100">
            <h3 class="text-sm font-bold text-marca-rojo mb-4 uppercase tracking-wider">Modo Administrador</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-marca-rojo mb-1">Tablet Asignada</label>
                <select id="tablet" class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none">
                  <option value="">-- Sin asignar --</option>
                  <option value="Tablet 1">Tablet 1</option>
                  <option value="Tablet 2">Tablet 2</option>
                  <option value="Tablet 3">Tablet 3</option>
                  <option value="Tablet 4">Tablet 4</option>
                  <option value="Tablet 5">Tablet 5</option>
                  <option value="Tablet 6">Tablet 6</option>
                </select>
              </div>
              
              <div>
                <label class="block text-xs font-bold text-marca-rojo mb-1">N° Fotos Realizadas</label>
                <input type="number" id="fotos" class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none">
              </div>

              <div class="col-span-1 md:col-span-2">
                <label class="block text-xs font-bold text-marca-rojo mb-1">Link Drive / Entregables</label>
                <input type="url" id="link" class="w-full border-gray-300 rounded-lg p-2.5 text-sm border focus:outline-none">
              </div>
            </div>
          </div>

          <!-- Botones de Acción -->
          <div class="flex justify-between items-center mt-6 pt-6 border-t border-gray-100">
            
            <!-- Botones Admin (Ocultos al crear) -->
            <div id="accionesAdmin" class="hidden flex gap-2">
              <button type="button" id="btnCancelar" onclick="cancelarRegistro()" class="px-4 py-2 rounded-full bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs transition-colors shadow-sm">
                Cancelar Evento
              </button>
              <button type="button" id="btnEliminar" onclick="eliminarRegistro()" class="px-4 py-2 rounded-full bg-red-600 hover:bg-red-700 text-white font-medium text-xs transition-colors shadow-sm">
                Borrar Registro
              </button>
            </div>

            <div class="flex gap-3 ml-auto">
              <button type="button" onclick="cerrarModal()" class="px-6 py-2.5 rounded-full text-marca-gris hover:bg-gray-100 font-medium text-sm transition-colors">Cerrar</button>
              <button type="submit" id="btnGuardar" class="px-6 py-2.5 rounded-full bg-marca-negro hover:bg-marca-gris text-white font-medium text-sm transition-all shadow-md">
                Guardar
              </button>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
